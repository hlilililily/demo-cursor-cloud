name: CalendarPro
options:
  bundleIdPrefix: com.calendarpro
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CalendarPro:
    type: application
    platform: [iOS, macOS]
    sources:
      - CalendarPro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calendarpro.app
        INFOPLIST_FILE: CalendarPro/Info.plist
        CODE_SIGN_ENTITLEMENTS: CalendarPro/CalendarPro.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"CalendarPro/Preview Content\""
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-Owholemodule"
    entitlements:
      path: CalendarPro/CalendarPro.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.network.client: true
        com.apple.developer.icloud-services:
          - CloudKit
          - CloudDocuments
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.calendarpro.app
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.calendarpro.app

  CalendarProTests:
    type: bundle.unit-test
    platform: [iOS, macOS]
    sources:
      - CalendarProTests
    dependencies:
      - target: CalendarPro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.calendarpro.tests
        GENERATE_INFOPLIST_FILE: "YES"
